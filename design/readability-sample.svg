<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">Hired Billing Support readability redesign sample</title>
  <desc id="description">A desktop and mobile homepage concept with larger body copy, high contrast, clear navigation, a static service list, and an unobtrusive chat control.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0A1628" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { fill: #0A1628; }
      .muted { fill: #39465B; }
      .green { fill: #08785F; }
      .white { fill: #FFFFFF; }
      .desktop-body { font-size: 18px; }
      .mobile-body { font-size: 17px; }
      .small-label { font-size: 14px; font-weight: 700; letter-spacing: 1.2px; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#F1EEE8"/>
  <text x="64" y="58" class="ink" font-size="30" font-weight="700">A clearer, calmer HBS homepage</text>
  <text x="64" y="88" class="muted" font-size="17">Sample direction • Larger reading text, stronger contrast, simpler scanning</text>
  <text x="64" y="137" class="ink small-label">DESKTOP</text>
  <text x="1190" y="137" class="ink small-label">MOBILE</text>

  <!-- Desktop homepage concept -->
  <g filter="url(#shadow)">
    <rect x="64" y="158" width="1080" height="870" rx="18" fill="#FAF7F2"/>
  </g>
  <rect x="64" y="158" width="1080" height="94" rx="18" fill="#FAF7F2"/>
  <path d="M64 234h1080" stroke="#DED8CE" stroke-width="1.5"/>
  <text x="100" y="213" class="ink" font-size="27" font-weight="700">+hbs</text>
  <text x="159" y="212" class="muted" font-size="13">HIRED BILLING SUPPORT</text>
  <text x="384" y="211" class="ink" font-size="16" font-weight="600">Services</text>
  <text x="485" y="211" class="ink" font-size="16" font-weight="600">Who We Serve</text>
  <text x="632" y="211" class="ink" font-size="16" font-weight="600">Resources</text>
  <text x="740" y="211" class="ink" font-size="16" font-weight="600">About</text>
  <rect x="841" y="180" width="128" height="48" rx="10" fill="#FFFFFF" stroke="#AEB6C0" stroke-width="1.5"/>
  <text x="905" y="210" text-anchor="middle" class="ink" font-size="16" font-weight="600">Call us</text>
  <rect x="982" y="180" width="128" height="48" rx="10" fill="#0A1628"/>
  <text x="1046" y="210" text-anchor="middle" class="white" font-size="16" font-weight="700">Talk to our team</text>

  <rect x="64" y="252" width="1080" height="58" fill="#E8E2D8"/>
  <text x="100" y="288" class="ink" font-size="16" font-weight="600">Revenue cycle management</text>
  <circle cx="374" cy="281" r="3.5" fill="#08785F"/>
  <text x="395" y="288" class="ink" font-size="16" font-weight="600">AR recovery</text>
  <circle cx="515" cy="281" r="3.5" fill="#08785F"/>
  <text x="536" y="288" class="ink" font-size="16" font-weight="600">Credentialing</text>
  <circle cx="691" cy="281" r="3.5" fill="#08785F"/>
  <text x="712" y="288" class="ink" font-size="16" font-weight="600">Virtual assistants</text>

  <text x="100" y="376" class="green small-label">HEALTHCARE OPERATIONS, MADE EASIER</text>
  <text x="100" y="446" class="ink" font-size="52" font-weight="700">Grow your practice.</text>
  <text x="100" y="508" class="ink" font-size="52" font-weight="700">We’ll handle the</text>
  <text x="100" y="570" class="ink" font-size="52" font-weight="700">operational work.</text>
  <text x="100" y="626" class="muted desktop-body">A trained remote team for billing, AR, credentialing and practice support—</text>
  <text x="100" y="654" class="muted desktop-body">working with your workflows so your staff can focus on patient care.</text>

  <rect x="100" y="694" width="194" height="56" rx="10" fill="#0A1628"/>
  <text x="197" y="729" text-anchor="middle" class="white" font-size="17" font-weight="700">Talk to our team</text>
  <rect x="309" y="694" width="186" height="56" rx="10" fill="#FAF7F2" stroke="#667386" stroke-width="1.5"/>
  <text x="402" y="729" text-anchor="middle" class="ink" font-size="17" font-weight="700">Explore services</text>

  <rect x="100" y="790" width="974" height="178" rx="14" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.5"/>
  <text x="128" y="830" class="ink" font-size="19" font-weight="700">A steady team behind your practice</text>
  <text x="128" y="862" class="muted" font-size="16">Clear ownership, consistent follow-up and practical support for your day-to-day work.</text>
  <path d="M128 883h918" stroke="#E3DED5" stroke-width="1.5"/>
  <text x="128" y="923" class="green" font-size="16" font-weight="700">✓  Human support</text>
  <text x="365" y="923" class="green" font-size="16" font-weight="700">✓  Clear reporting</text>
  <text x="592" y="923" class="green" font-size="16" font-weight="700">✓  Works with your systems</text>
  <text x="874" y="923" class="green" font-size="16" font-weight="700">✓  U.S. time zones</text>

  <!-- Mobile homepage concept -->
  <g filter="url(#shadow)">
    <rect x="1190" y="158" width="350" height="870" rx="24" fill="#FAF7F2"/>
  </g>
  <rect x="1190" y="158" width="350" height="76" rx="24" fill="#FAF7F2"/>
  <path d="M1190 222h350" stroke="#DED8CE" stroke-width="1.5"/>
  <circle cx="1228" cy="196" r="20" fill="#E8E2D8"/>
  <path d="M1219 190h18M1219 196h18M1219 202h18" stroke="#0A1628" stroke-width="2" stroke-linecap="round"/>
  <text x="1270" y="195" class="ink" font-size="20" font-weight="700">+hbs</text>
  <text x="1270" y="211" class="muted" font-size="9" font-weight="700">HIRED BILLING SUPPORT</text>
  <circle cx="1500" cy="196" r="20" fill="#E8E2D8"/>
  <circle cx="1497" cy="193" r="6" fill="none" stroke="#0A1628" stroke-width="2"/>
  <path d="M1501 198l5 5" stroke="#0A1628" stroke-width="2" stroke-linecap="round"/>

  <rect x="1190" y="234" width="350" height="52" fill="#E8E2D8"/>
  <text x="1210" y="266" class="ink" font-size="15" font-weight="700">Billing support</text>
  <path d="M1480 255l7 7 7-7" fill="none" stroke="#0A1628" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="1214" y="334" class="green" font-size="12" font-weight="700" letter-spacing=".8">HEALTHCARE OPERATIONS</text>
  <text x="1214" y="387" class="ink" font-size="34" font-weight="700">Grow your</text>
  <text x="1214" y="429" class="ink" font-size="34" font-weight="700">practice.</text>
  <text x="1214" y="471" class="ink" font-size="34" font-weight="700">We’ll handle</text>
  <text x="1214" y="513" class="ink" font-size="34" font-weight="700">the operations.</text>
  <text x="1214" y="557" class="muted mobile-body">A trained team for billing, AR,</text>
  <text x="1214" y="583" class="muted mobile-body">credentialing and practice support—</text>
  <text x="1214" y="609" class="muted mobile-body">so your staff can focus on patients.</text>

  <rect x="1214" y="640" width="302" height="54" rx="10" fill="#0A1628"/>
  <text x="1365" y="674" text-anchor="middle" class="white" font-size="17" font-weight="700">Talk to our team</text>
  <text x="1365" y="726" text-anchor="middle" class="ink" font-size="16" font-weight="700">Explore services</text>

  <rect x="1214" y="755" width="302" height="135" rx="12" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.5"/>
  <text x="1234" y="789" class="ink" font-size="17" font-weight="700">Support that fits your</text>
  <text x="1234" y="813" class="ink" font-size="17" font-weight="700">practice workflow</text>
  <text x="1234" y="849" class="muted" font-size="15">Clear ownership and reliable follow-up.</text>

  <rect x="1302" y="915" width="214" height="54" rx="27" fill="#0A1628"/>
  <text x="1409" y="948" text-anchor="middle" class="white" font-size="16" font-weight="700">Chat with our team</text>
  <circle cx="1489" cy="920" r="5" fill="#08785F"/>

  <text x="64" y="1074" class="muted" font-size="15">Design principles: 18px desktop body copy • 17px mobile copy • 16px links and controls • high-contrast text • no moving ticker</text>
</svg>
